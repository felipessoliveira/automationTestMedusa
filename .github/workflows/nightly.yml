name: Nightly tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  BASE_URL: ${{ vars.BASE_URL }}
  LOCALE: ${{ vars.LOCALE }}
  MEDUSA_API_URL: ${{ vars.MEDUSA_API_URL }}
  MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
  TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
  HEADED: '0'

jobs:
  api:
    name: API scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed shared user
        run: npx ts-node scripts/seed_shared_user.ts

      - name: Run @api scenarios
        run: npm run test:api

      - name: Locate allure results (debug)
        if: always()
        run: |
          echo "::group::Workspace top-level"
          ls -la
          echo "::endgroup::"
          echo "::group::reports/ tree"
          ls -laR reports/ 2>/dev/null || echo "(no reports/ dir)"
          echo "::endgroup::"
          echo "::group::Any *-result.json file in workspace"
          find . -path ./node_modules -prune -o -type f \( -name '*-result.json' -o -name '*-container.json' \) -print | head -20
          echo "::endgroup::"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 30

  ui:
    name: UI scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed shared user
        run: npx ts-node scripts/seed_shared_user.ts

      - name: Run @ui scenarios
        run: npm run test:ui

      - name: Locate allure results (debug)
        if: always()
        run: |
          echo "::group::Workspace top-level"
          ls -la
          echo "::endgroup::"
          echo "::group::reports/ tree"
          ls -laR reports/ 2>/dev/null || echo "(no reports/ dir)"
          echo "::endgroup::"
          echo "::group::Any *-result.json file in workspace"
          find . -path ./node_modules -prune -o -type f \( -name '*-result.json' -o -name '*-container.json' \) -print | head -20
          echo "::endgroup::"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ui
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 30

  publish-report:
    name: Build Allure Pages artifact
    needs: [api, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download api results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-api
          path: allure-input/api

      - name: Download ui results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-ui
          path: allure-input/ui

      - name: Restore Allure history cache
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-history-

      - name: Inspect downloaded artifacts (debug)
        run: |
          echo "::group::api artifact tree"
          find allure-input/api -maxdepth 3 -type d 2>/dev/null || echo "(no api artifact)"
          echo "::endgroup::"
          echo "::group::ui artifact tree"
          find allure-input/ui -maxdepth 3 -type d 2>/dev/null || echo "(no ui artifact)"
          echo "::endgroup::"

      - name: Merge allure-results from both jobs
        run: |
          mkdir -p reports/allure-results
          shopt -s nullglob
          for src in allure-input/api allure-input/api/allure-results allure-input/api/reports/allure-results \
                     allure-input/ui allure-input/ui/allure-results allure-input/ui/reports/allure-results; do
            if [ -d "$src" ]; then
              echo "Copying from $src"
              cp -r "$src/." reports/allure-results/
            fi
          done
          result_count="$(find reports/allure-results -maxdepth 1 -name '*-result.json' | wc -l | tr -d ' ')"
          echo "Merged $result_count Allure result files"
          if [ "$result_count" -eq 0 ]; then
            echo "No Allure result files were found. Cannot publish an empty report."
            exit 1
          fi

      - name: Copy previous history into results
        run: |
          if [ -d allure-history ]; then
            mkdir -p reports/allure-results/history
            cp -r allure-history/. reports/allure-results/history/
            echo "Restored history from cache."
          else
            echo "No previous history found."
          fi

      - name: Add Allure executor metadata
        run: |
          cat > reports/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Nightly tests #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Nightly Allure Report #${{ github.run_number }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOF

      - name: Generate merged Allure report
        run: npm run report:gen

      - name: Prepare Allure history cache
        run: |
          rm -rf allure-history
          mkdir -p allure-history
          if [ -d reports/allure-report/history ]; then
            cp -r reports/allure-report/history/. allure-history/
            echo "Prepared generated history for cache."
          else
            echo "No generated history directory found."
          fi

      - name: Save Allure history cache
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/allure-report

  deploy-pages:
    name: Deploy Allure to Pages
    needs: publish-report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
